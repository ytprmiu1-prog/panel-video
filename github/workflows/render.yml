name: Render video
on:
  workflow_dispatch:
    inputs:
      title:
        description: Judul
        default: Halo Dunia
      subtitle:
        description: Subjudul
        default: Video pertamaku
      bgColor:
        description: Warna latar
        default: '#111827'
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: echo "$WORKFLOW_INPUT" > input-props.json
        env:
          WORKFLOW_INPUT: ${{ toJson(github.event.inputs) }}
      - run: npx remotion render src/index.ts MyComp out/video.mp4 --props=./input-props.json
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
