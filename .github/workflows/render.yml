name: Render video
on:
  workflow_dispatch:
    inputs:
      judul:
        description: Nama video (opsional)
        default: Video
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx remotion render src/index.ts Video out/video.mp4
      - run: gh release create "video-${{ github.run_number }}" out/video.mp4 --title "$JUDUL" --notes "Render nomor ${{ github.run_number }}"
        env:
          GH_TOKEN: ${{ github.token }}
          JUDUL: ${{ github.event.inputs.judul }}
